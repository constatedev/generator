<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14151c">
<title>Game Idea Generator</title>
<style>
  :root{
    --bg:#14151c; --card:#1d1f2a; --card2:#252837; --text:#eceef7; --muted:#8e93a8;
    --accent:#7c5cff; --accent2:#2ee6a6; --danger:#ff5c7a; --radius:14px;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f3f4f9; --card:#fff; --card2:#eceef6; --text:#1b1d28; --muted:#6a6f86; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--text);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  }
  .wrap{max-width:760px;margin:0 auto}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  h1{font-size:1.5rem;margin:.2em 0 .1em}
  .lang{display:flex;background:var(--card2);border-radius:10px;padding:3px;flex:none;margin-top:6px}
  .lang button{
    border:0;background:transparent;color:var(--muted);font-weight:700;font-size:.85rem;
    padding:8px 12px;border-radius:8px;cursor:pointer;min-width:44px;
  }
  .lang button.active{background:var(--accent);color:#fff}
  .sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
  .grid{display:grid;gap:10px;grid-template-columns:1fr}
  @media (min-width:640px){ .grid{grid-template-columns:1fr 1fr} .grid .wide{grid-column:1/-1} }
  .item{
    background:var(--card);border-radius:var(--radius);padding:12px 14px;
    display:flex;align-items:center;gap:10px;border:2px solid transparent;
    transition:border-color .15s, transform .15s;
  }
  .item.locked{border-color:var(--accent2)}
  .item .body{flex:1;min-width:0}
  .label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .value{font-size:1.05rem;font-weight:600;word-wrap:break-word}
  .value.pop{animation:pop .25s ease}
  @keyframes pop{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
  .icon-btn{
    background:var(--card2);color:var(--text);border:0;border-radius:10px;
    width:42px;height:42px;font-size:1.1rem;cursor:pointer;flex:none;
  }
  .icon-btn:active{transform:scale(.94)}
  .icon-btn.on{background:var(--accent2);color:#06231a}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
  .btn{
    border:0;border-radius:12px;padding:14px 18px;font-size:1rem;font-weight:600;
    cursor:pointer;color:var(--text);background:var(--card2);flex:1 1 140px;
  }
  .btn.primary{background:var(--accent);color:#fff;flex:2 1 220px;font-size:1.1rem}
  .btn:active{transform:scale(.98)}
  .pitch{
    background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(46,230,166,.12));
    border-radius:var(--radius);padding:14px 16px;margin-top:12px;font-size:1.02rem;
  }
  h2{font-size:1.1rem;margin:26px 0 10px}
  .fav{background:var(--card);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
  .fav .txt{flex:1;font-size:.95rem;white-space:pre-line}
  .empty{color:var(--muted);font-size:.95rem}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
    background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;
    opacity:0;pointer-events:none;transition:.2s;font-size:.9rem;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  footer{margin-top:30px;color:var(--muted);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 data-i18n="title"></h1>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ru">RU</button>
    </div>
  </div>
  <p class="sub" data-i18n="sub"></p>

  <div class="grid" id="grid"></div>

  <div class="pitch" id="pitch"></div>

  <div class="actions">
    <button class="btn primary" id="rollAll" data-i18n="rollAll"></button>
    <button class="btn" id="save" data-i18n="save"></button>
    <button class="btn" id="copy" data-i18n="copy"></button>
  </div>

  <h2 data-i18n="favs"></h2>
  <div id="favs"></div>

  <footer data-i18n="footer"></footer>
</div>
<div class="toast" id="toast"></div>

const KEYS = Object.keys(DATA);
const LS_STATE = "gig_state_v2", LS_FAV = "gig_fav_v2", LS_FAV_OLD = "gig_fav_v1", LS_LANG = "gig_lang";
let state = {};      // {key: {i: index, locked: bool}}
let favs = [];       // entries: {key: index, ...} or a legacy plain string
let lang = "en";     // default language

const $ = s => document.querySelector(s);
const t = k => UI[lang][k];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const list = k => DATA[k].items[lang];
const pickIdx = k => Math.floor(Math.random() * DATA[k].items.en.length);

function load(){
  try{ const l = localStorage.getItem(LS_LANG); if(l === "ru" || l === "en") lang = l; }catch(e){}
  try{ state = JSON.parse(localStorage.getItem(LS_STATE)) || {}; }catch(e){ state = {}; }
  try{ favs = JSON.parse(localStorage.getItem(LS_FAV)) || []; }catch(e){ favs = []; }
  // migrate favorites saved by the first (text-only) version
  try{
    const old = JSON.parse(localStorage.getItem(LS_FAV_OLD)) || [];
    old.forEach(s=>{ if(typeof s === "string" && !favs.includes(s)) favs.push(s); });
  }catch(e){}
  KEYS.forEach(k=>{
    const n = DATA[k].items.en.length;
    const s = state[k];
    if(!s || !Number.isInteger(s.i) || s.i < 0 || s.i >= n) state[k] = {i:pickIdx(k), locked:false};
  });
}
function persist(){
  try{
    localStorage.setItem(LS_STATE, JSON.stringify(state));
    localStorage.setItem(LS_FAV, JSON.stringify(favs));
    localStorage.setItem(LS_LANG, lang);
  }catch(e){}
}

function rollOne(k){
  const n = DATA[k].items.en.length;
  let i = pickIdx(k), c = 0;
  while(i === state[k].i && n > 1 && c++ < 10) i = pickIdx(k);
  state[k].i = i;
}

function pitchFrom(idx){
  const v = {};
  KEYS.forEach(k=>{ v[k] = list(k)[idx[k]]; });
  return t("pitch")(v, cap);
}
function currentIdx(){
  const o = {}; KEYS.forEach(k=>{ o[k] = state[k].i; }); return o;
}
const pitchText = () => pitchFrom(currentIdx());

function applyLang(){
  document.documentElement.lang = lang;
  document.title = t("pageTitle");
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".lang button").forEach(b=>{
    b.classList.toggle("active", b.dataset.lang === lang);
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
  });
}

function render(animateKeys=[]){
  applyLang();
  const grid = $("#grid");
  grid.innerHTML = "";
  KEYS.forEach((k,n)=>{
    const st = state[k];
    const el = document.createElement("div");
    el.className = "item" + (st.locked ? " locked":"") + (n===KEYS.length-1 ? " wide":"");
    el.innerHTML = `
      <div class="body">
        <div class="label"></div>
        <div class="value ${animateKeys.includes(k)?"pop":""}"></div>
      </div>
      <button class="icon-btn" data-act="roll">🎲</button>
      <button class="icon-btn ${st.locked?"on":""}" data-act="lock">${st.locked?"🔒":"🔓"}</button>`;
    el.querySelector(".label").textContent = DATA[k].label[lang];
    el.querySelector(".value").textContent = list(k)[st.i];
    const rb = el.querySelector('[data-act="roll"]'), lb = el.querySelector('[data-act="lock"]');
    rb.title = rb.ariaLabel = t("rollTitle");
    lb.title = lb.ariaLabel = t("lockTitle");
    rb.onclick = ()=>{ if(st.locked){ toast(t("unlockFirst")); return;} rollOne(k); persist(); render([k]); };
    lb.onclick = ()=>{ st.locked=!st.locked; persist(); render(); };
    grid.appendChild(el);
  });
  $("#pitch").textContent = "💡 " + pitchText();
  renderFavs();
}

function favText(f){ return typeof f === "string" ? f : pitchFrom(f); }

function renderFavs(){
  const box = $("#favs");
  if(!favs.length){ box.innerHTML = ""; const e = document.createElement("div"); e.className="empty"; e.textContent = t("empty"); box.appendChild(e); return; }
  box.innerHTML = "";
  favs.forEach((f,i)=>{
    const text = favText(f);
    const d = document.createElement("div");
    d.className = "fav";
    const tx = document.createElement("div"); tx.className="txt"; tx.textContent = text;
    const c = document.createElement("button"); c.className="icon-btn"; c.textContent="📋"; c.title=t("copy").replace(/^\S+\s*/,"");
    c.onclick = ()=>copyText(text);
    const x = document.createElement("button"); x.className="icon-btn"; x.textContent="✕"; x.title=t("del");
    x.onclick = ()=>{ favs.splice(i,1); persist(); renderFavs(); };
    d.append(tx,c,x); box.appendChild(d);
  });
}

function rollAll(){
  const changed = [];
  KEYS.forEach(k=>{ if(!state[k].locked){ rollOne(k); changed.push(k);} });
  persist(); render(changed);
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast(t("copied")); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand("copy"); toast(t("copied")); }catch(_){ toast(t("copyFail")); }
    ta.remove();
  }
}

let tt;
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(tt); tt = setTimeout(()=>el.classList.remove("show"), 1600);
}

$("#rollAll").onclick = rollAll;
$("#copy").onclick = ()=>copyText(pitchText());
$("#save").onclick = ()=>{
  const idx = currentIdx(), key = JSON.stringify(idx);
  if(favs.some(f=>typeof f !== "string" && JSON.stringify(f) === key)){ toast(t("already")); return; }
  favs.unshift(idx); persist(); renderFavs(); toast(t("saved"));
};
document.querySelectorAll(".lang button").forEach(b=>{
  b.onclick = ()=>{ lang = b.dataset.lang; persist(); render(); };
});
document.addEventListener("keydown", e=>{
  if(e.code==="Space" && !/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)){ e.preventDefault(); rollAll(); }
});

load(); render();
</script>
